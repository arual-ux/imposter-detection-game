<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Imposter Detection Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        font-family: Arial, sans-serif;
        background: #0d1117;
        color: #e6edf3;
        padding: 20px;
        margin: 0;
    }

    #gameBox {
        background: #161b22;
        padding: 20px;
        border-radius: 10px;
        max-width: 800px;
        margin: auto;
        animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    button {
        width: 100%;
        padding: 14px;
        margin: 10px 0;
        border: none;
        border-radius: 6px;
        font-size: 18px;
        cursor: pointer;
        transition: transform 0.2s ease;
    }

    button:hover {
        transform: scale(1.05);
    }

    #imposterBtn {
        background: #d73a49;
        color: white;
    }

    #realBtn {
        background: #238636;
        color: white;
    }

    #startBtn {
        background: #2ea043;
        color: white;
    }

    #progressContainer {
        width: 100%;
        background: #21262d;
        border-radius: 6px;
        overflow: hidden;
        margin-bottom: 15px;
        height: 14px;
    }

    #progressBar {
        height: 100%;
        width: 0%;
        background: #238636;
        transition: width 0.3s ease;
    }

    #avatar {
        font-size: 60px;
        text-align: center;
        animation: bounceIn 0.6s ease;
    }

    @keyframes bounceIn {
        0% { transform: scale(0.3); opacity: 0; }
        60% { transform: scale(1.2); opacity: 1; }
        100% { transform: scale(1); }
    }

    .confetti {
        position: fixed;
        width: 10px;
        height: 10px;
        background: red;
        animation: fall 3s linear infinite;
        top: -10px;
        z-index: 9999;
    }

    @keyframes fall {
        to { transform: translateY(110vh) rotate(360deg); }
    }

    @media (max-width: 600px) {
        #avatar { font-size: 45px; }
        button { font-size: 16px; padding: 12px; }
    }
</style>
</head>

<body>

<div id="gameBox">
    <h1>🕵️ Imposter Detection Game</h1>

    <div id="startScreen">
        <p><strong>Pass threshold: 80%</strong></p>
        <p>You will be shown 10 random scenarios from a bank of 40. Decide whether each one is an <strong>Imposter</strong> or <strong>Real</strong>.</p>
        <p>At the end, you’ll see your score and a list of any questions you got wrong.</p>
        <button id="startBtn" onclick="startGame()">Start Game</button>
    </div>

    <div id="gameContent" style="display:none;">
        <div id="progressContainer">
            <div id="progressBar"></div>
        </div>

        <p id="timer"></p>
        <div id="avatar"></div>
        <p id="scenario"></p>
        <div id="choices"></div>
        <p id="feedback"></p>
    </div>

    <div id="results" style="display:none;"></div>
</div>

<script>
let level = 0;
let score = 0;
let wrongAnswers = [];
let timer;
let timeLeft = 10;

const avatars = ["👨‍💼","👩‍💻","👤","🧑‍🔧","🧑‍💼","🕵️","🤖","🧛","🧑‍🚀","👨‍🏫"];

// 40‑question bank
const questionBank = [
    // Imposters
    { text: "Email: 'Your mailbox is full. Click here to upgrade storage.'", isImposter: true, rightAction: "Report and delete the email." },
    { text: "Caller claims to be IT and asks for your password.", isImposter: true, rightAction: "Never share passwords. Report the call." },
    { text: "SMS: 'Your payroll info is incorrect. Log in here.'", isImposter: true, rightAction: "Use the official HR portal, not the link." },
    { text: "Teams message: 'I need you to urgently approve this invoice.'", isImposter: true, rightAction: "Verify through known channels." },
    { text: "Email from unknown supplier requesting immediate payment.", isImposter: true, rightAction: "Verify supplier identity before paying." },
    { text: "Phone call: 'Your computer is infected. Install this tool.'", isImposter: true, rightAction: "Never install unknown software." },
    { text: "Email: 'Your MFA token is expiring. Send your code.'", isImposter: true, rightAction: "Never share MFA codes." },
    { text: "Visitor: 'I’m from maintenance. Let me into the server room.'", isImposter: true, rightAction: "Verify identity and require ID." },
    { text: "Slack message: 'Share customer data for audit.'", isImposter: true, rightAction: "Verify with the audit team." },
    { text: "Email: 'Your account will be deleted today. Click here.'", isImposter: true, rightAction: "Report the phishing attempt." },
    { text: "Phone call spoofing CEO asking for urgent transfer.", isImposter: true, rightAction: "Verify with CEO’s PA." },
    { text: "Email from similar domain: '@companny.com'.", isImposter: true, rightAction: "Check sender domain carefully." },
    { text: "Message: 'Keep this secret. I need your help urgently.'", isImposter: true, rightAction: "Urgency + secrecy = red flag." },
    { text: "Email: 'Download this attachment to view secure message.'", isImposter: true, rightAction: "Do not open unknown attachments." },
    { text: "Caller pretending to be bank asking for verification code.", isImposter: true, rightAction: "Never share verification codes." },
    { text: "Email: 'We detected suspicious login. Confirm your identity.'", isImposter: true, rightAction: "Use official login page only." },
    { text: "WhatsApp message from unknown number claiming to be HR.", isImposter: true, rightAction: "HR will not contact via WhatsApp." },
    { text: "Email: 'Pay this overdue invoice immediately.'", isImposter: true, rightAction: "Verify invoice legitimacy." },
    { text: "Caller: 'I’m new IT staff. What’s your username?'", isImposter: true, rightAction: "Do not share credentials." },
    { text: "Email: 'Your VPN access is suspended. Log in here.'", isImposter: true, rightAction: "Use official VPN portal." },

    // Real (40%)
    { text: "HR email reminding you to complete annual training.", isImposter: false, rightAction: "Complete training via official portal." },
    { text: "Manager emails from official domain requesting a meeting.", isImposter: false, rightAction: "Attend the meeting." },
    { text: "IT email announcing scheduled maintenance.", isImposter: false, rightAction: "Note the maintenance window." },
    { text: "Payroll email confirming monthly payslip availability.", isImposter: false, rightAction: "Access payslip via official HR system." },
    { text: "Security team email about new MFA rollout.", isImposter: false, rightAction: "Follow official MFA setup steps." },
    { text: "Supplier email confirming delivery date.", isImposter: false, rightAction: "Acknowledge the update." },
    { text: "Internal email about upcoming company event.", isImposter: false, rightAction: "Read details and attend if needed." },
    { text: "Manager calls from known number asking for project update.", isImposter: false, rightAction: "Provide the update." },
    { text: "IT sends reminder to restart your device for updates.", isImposter: false, rightAction: "Restart your device." },
    { text: "Facilities email about fire drill schedule.", isImposter: false, rightAction: "Follow drill instructions." },
    { text: "HR email confirming your leave request.", isImposter: false, rightAction: "Acknowledge confirmation." },
    { text: "Finance email confirming approved expense claim.", isImposter: false, rightAction: "Record the approval." },
    { text: "Internal newsletter from communications team.", isImposter: false, rightAction: "Read the newsletter." },
    { text: "IT email about password expiry next week.", isImposter: false, rightAction: "Change password via official portal." },
    { text: "Team lead messages you about tomorrow’s meeting.", isImposter: false, rightAction: "Prepare for the meeting." },
    { text: "Official email confirming system outage resolution.", isImposter: false, rightAction: "Resume normal work." },
    { text: "HR email about policy updates.", isImposter: false, rightAction: "Review updated policies." },
    { text: "Internal audit team requests scheduled documentation.", isImposter: false, rightAction: "Provide documents via secure channel." },
    { text: "IT email confirming your support ticket update.", isImposter: false, rightAction: "Review ticket status." },
    { text: "Manager sends official survey link.", isImposter: false, rightAction: "Complete the survey." }
];

// Select 10 random questions
function getRandomQuestions() {
    const shuffled = [...questionBank].sort(() => 0.5 - Math.random());
    return shuffled.slice(0, 10);
}

let scenarios = getRandomQuestions();

function startGame() {
    document.getElementById("startScreen").style.display = "none";
    document.getElementById("gameContent").style.display = "block";
    loadLevel();
}

function updateProgressBar() {
    const progress = (level / scenarios.length) * 100;
    document.getElementById("progressBar").style.width = progress + "%";
}

function startTimer() {
    timeLeft = 10;
    document.getElementById("timer").innerText = "⏱️ Time left: " + timeLeft;

    timer = setInterval(() => {
        timeLeft--;
        document.getElementById("timer").innerText = "⏱️ Time left: " + timeLeft;

        if (timeLeft <= 0) {
            clearInterval(timer);
            const current = scenarios[level];

            wrongAnswers.push({
                scenario: current.text,
                correctAnswer: current.isImposter ? "Imposter" : "Real",
                action: current.rightAction
            });

            document.getElementById("feedback").innerHTML =
                "⛔ Time's up!<br>Correct answer: " +
                (current.isImposter ? "Imposter" : "Real") +
                "<br>Right action: " + current.rightAction;

            setTimeout(() => {
                level++;
                loadLevel();
            }, 2000);
        }
    }, 1000);
}

function loadLevel() {
    if (level >= scenarios.length) {
        endGame();
        return;
    }

    updateProgressBar();
    const current = scenarios[level];

    document.getElementById("avatar").innerText = avatars[Math.floor(Math.random() * avatars.length)];
    document.getElementById("scenario").innerText = current.text;

    document.getElementById("choices").innerHTML = `
        <button id="imposterBtn" onclick="handleChoice(true)">Imposter</button>
        <button id="realBtn" onclick="handleChoice(false)">Real</button>
    `;

    document.getElementById("feedback").innerText = "";
    startTimer();
}

function handleChoice(chosenImposter) {
    clearInterval(timer);
    const current = scenarios[level];
    const correct = current.isImposter === chosenImposter;

    if (correct) {
        score++;
        document.getElementById("feedback").innerHTML = "✔️ Correct!";
    } else {
        wrongAnswers.push({
            scenario: current.text,
            correctAnswer: current.isImposter ? "Imposter" : "Real",
            action: current.rightAction
        });

        document.getElementById("feedback").innerHTML =
            `❌ Incorrect.<br>Correct answer: ${current.isImposter ? "Imposter" : "Real"}<br>Action: ${current.rightAction}`;
    }

    setTimeout(() => {
        level++;
        loadLevel();
    }, 2000);
}

function launchConfetti() {
    for (let i = 0; i < 150; i++) {
        const confetti = document.createElement("div");
        confetti.classList.add("confetti");
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
        confetti.style.animationDuration = (Math.random() * 2 + 2) + "s";
        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 4000);
    }
}

function endGame() {
    document.getElementById("gameContent").style.display = "none";
    document.getElementById("timer").innerText = "";

    const resultsDiv = document.getElementById("results");
    resultsDiv.style.display = "block";

    const total = scenarios.length;
    const percentage = (score / total) * 100;

    let resultHTML = `<h2>Results</h2>
                      <p>Your score: ${score}/${total} (${percentage.toFixed(0)}%)</p>`;

    if (percentage >= 80) {
        resultHTML += `<h3>🎉 Congratulations! You passed!</h3>`;
        launchConfetti();
    } else {
        resultHTML += `<h3>😕 Better luck next time!</h3>`;
    }

    if (wrongAnswers.length > 0) {
        resultHTML += `<h3>Review Your Mistakes:</h3><ul>`;
        wrongAnswers.forEach(item => {
            resultHTML += `<li><strong>Scenario:</strong> ${item.scenario}<br>
                           <strong>Correct Answer:</strong> ${item.correctAnswer}<br>
                           <strong>Right Action:</strong> ${item.action}</li><br>`;
        });
        resultHTML += `</ul>`;
    }

    resultsDiv.innerHTML = resultHTML;
}
</script>

</body>
</html>
