<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Imposter Detection Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        font-family: Arial, sans-serif;
        background: #0d1117;
        color: #e6edf3;
        padding: 20px;
        margin: 0;
    }

    #gameBox {
        background: #161b22;
        padding: 20px;
        border-radius: 10px;
        max-width: 800px;
        margin: auto;
        animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    button {
        width: 100%;
        padding: 14px;
        margin: 10px 0;
        border: none;
        border-radius: 6px;
        font-size: 18px;
        cursor: pointer;
        transition: transform 0.2s ease;
    }

    button:hover {
        transform: scale(1.05);
    }

    #imposterBtn {
        background: #d73a49;
        color: white;
    }

    #realBtn {
        background: #238636;
        color: white;
    }

    #startBtn {
        background: #2ea043;
        color: white;
    }

    #progressContainer {
        width: 100%;
        background: #21262d;
        border-radius: 6px;
        overflow: hidden;
        margin-bottom: 15px;
        height: 14px;
    }

    #progressBar {
        height: 100%;
        width: 0%;
        background: #238636;
        transition: width 0.3s ease;
    }

    #avatar {
        font-size: 60px;
        text-align: center;
        animation: bounceIn 0.6s ease;
    }

    @keyframes bounceIn {
        0% { transform: scale(0.3); opacity: 0; }
        60% { transform: scale(1.2); opacity: 1; }
        100% { transform: scale(1); }
    }

    .confetti {
        position: fixed;
        width: 10px;
        height: 10px;
        background: red;
        animation: fall 3s linear infinite;
        top: -10px;
        z-index: 9999;
    }

    @keyframes fall {
        to { transform: translateY(110vh) rotate(360deg); }
    }

    @media (max-width: 600px) {
        #avatar { font-size: 45px; }
        button { font-size: 16px; padding: 12px; }
    }
</style>
</head>

<body>

<div id="gameBox">
    <h1>🕵️ Imposter Detection Game</h1>

    <div id="startScreen">
        <p><strong>Pass threshold: 80%</strong></p>
        <p>You will be shown a series of scenarios. Your job is to decide whether the person is an <strong>Imposter</strong> or <strong>Real</strong>.</p>
        <p>At the end, you’ll see your score and a list of any questions you got wrong.</p>
        <button id="startBtn" onclick="startGame()">Start Game</button>
    </div>

    <div id="gameContent" style="display:none;">
        <div id="progressContainer">
            <div id="progressBar"></div>
        </div>

        <div id="avatar"></div>
        <p id="scenario"></p>
        <div id="choices"></div>
        <p id="feedback"></p>
    </div>

    <div id="results" style="display:none;"></div>
</div>

<script>
let level = 0;
let score = 0;
let wrongAnswers = [];
let timer;
let timeLeft = 15;

const avatars = ["👨‍💼","👩‍💻","👤","🧑‍🔧","🧑‍💼","🕵️","🤖","🧛","🧑‍🚀","👨‍🏫"];

const scenarios = [
    { text: "Email from security-alert@companyverify-login.com: 'Your account will be disabled in 10 minutes.'", isImposter: true, rightAction: "Report the email as suspicious." },
    { text: "Teams message from your manager: 'Buy £200 in gift cards urgently.'", isImposter: true, rightAction: "Verify by calling your manager directly." },
    { text: "Supplier emails new bank details with a slightly different phone number.", isImposter: true, rightAction: "Verify using the official number on file." },
    { text: "Caller claims to be IT and asks for your MFA code.", isImposter: true, rightAction: "Never share MFA codes. Report the call." },
    { text: "Visitor claims to be IT support but has no ID.", isImposter: true, rightAction: "Refuse entry and verify with IT." },
    { text: "Email from it-support@yourcompany.com reminding you of a scheduled password change.", isImposter: false, rightAction: "Use the official portal to change your password." },
    { text: "HR email from hr@yourcompany.com asking you to complete your annual benefits form.", isImposter: false, rightAction: "Access the HR system using your usual link." },
    { text: "Supplier emails from their usual domain confirming a payment that matches a purchase order.", isImposter: false, rightAction: "Process the payment normally." },
    { text: "Your manager calls from their usual number reminding you to submit a report.", isImposter: false, rightAction: "Submit the report as requested." }
];

// Shuffle scenarios
function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}
shuffle(scenarios);

function startGame() {
    document.getElementById("startScreen").style.display = "none";
    document.getElementById("gameContent").style.display = "block";
    loadLevel();
}

function updateProgressBar() {
    const progress = (level / scenarios.length) * 100;
    document.getElementById("progressBar").style.width = progress + "%";
}

function loadLevel() {
    if (level >= scenarios.length) {
        endGame();
        return;
    }

    updateProgressBar();
    const current = scenarios[level];

    document.getElementById("avatar").innerText = avatars[Math.floor(Math.random() * avatars.length)];
    document.getElementById("scenario").innerText = current.text;

    const choicesDiv = document.getElementById("choices");
    choicesDiv.innerHTML = `
        <button id="imposterBtn" onclick="handleChoice(true)">Imposter</button>
        <button id="realBtn" onclick="handleChoice(false)">Real</button>
    `;

    document.getElementById("feedback").innerText = "";
}

function handleChoice(chosenImposter) {
    const current = scenarios[level];
    const correct = current.isImposter === chosenImposter;

    if (correct) {
        score++;
        document.getElementById("feedback").innerHTML = "✔️ Correct!";
    } else {
        wrongAnswers.push({
            scenario: current.text,
            correctAnswer: current.isImposter ? "Imposter" : "Real",
            action: current.rightAction
        });

        document.getElementById("feedback").innerHTML =
            `❌ Incorrect.<br>Correct answer: ${current.isImposter ? "Imposter" : "Real"}<br>Action: ${current.rightAction}`;
    }

    setTimeout(() => {
        level++;
        loadLevel();
    }, 2000);
}

function launchConfetti() {
    for (let i = 0; i < 150; i++) {
        const confetti = document.createElement("div");
        confetti.classList.add("confetti");
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
        confetti.style.animationDuration = (Math.random() * 2 + 2) + "s";
        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 4000);
    }
}

function endGame() {
    document.getElementById("gameContent").style.display = "none";
    const resultsDiv = document.getElementById("results");
    resultsDiv.style.display = "block";

    const total = scenarios.length;
    const percentage = (score / total) * 100;

    let resultHTML = `<h2>Results</h2>
                      <p>Your score: ${score}/${total} (${percentage.toFixed(0)}%)</p>`;

    if (percentage >= 80) {
        resultHTML += `<h3>🎉 Congratulations! You passed!</h3>`;
        launchConfetti();
    } else {
        resultHTML += `<h3>😕 Better luck next time!</h3>`;
    }

    if (wrongAnswers.length > 0) {
        resultHTML += `<h3>Review Your Mistakes:</h3><ul>`;
        wrongAnswers.forEach(item => {
            resultHTML += `<li><strong>Scenario:</strong> ${item.scenario}<br>
                           <strong>Correct Answer:</strong> ${item.correctAnswer}<br>
                           <strong>Right Action:</strong> ${item.action}</li><br>`;
        });
        resultHTML += `</ul>`;
    }

    resultsDiv.innerHTML = resultHTML;
}
</script>

</body>
</html>
